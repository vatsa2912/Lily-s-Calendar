<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7ef"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script><title>Lily's Calendar</title></head>
<body><header><div class="brand"><img src="./icon-192.png" alt=""> Lily's Calendar</div><div><button id="enablePush">Enable lock-screen alerts</button> <button id="add" class="primary">+ Add reminder</button></div></header>
<main><section class="hero"><div><p class="eyebrow">LILY'S CARE SCHEDULE</p><h1>A little care,<br><em>every day.</em></h1></div><div class="paw" aria-hidden="true">🐾</div></section>
<div class="grid"><section class="panel calendar" aria-label="Calendar"><div class="bar"><h2 id="month"></h2><div><button id="prev" aria-label="Previous month">‹</button> <button id="next" aria-label="Next month">›</button></div></div><div class="week" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div id="days" class="days"></div><button id="today">Back to today</button></section>
<section class="panel agenda"><div class="bar"><h2 id="dayTitle"></h2><button id="history">History</button></div><div id="items"></div></section></div>
<p id="pushStatus" class="foot">Install on iPhone from Safari using Share → Add to Home Screen, then enable lock-screen alerts.</p></main>
<dialog id="editor"><form id="reminder"><div class="bar"><h2 id="editorTitle">Add reminder</h2><button type="button" data-close="editor" aria-label="Close">×</button></div><label>Reminder name<input name="title" required maxlength="100" placeholder="Lily's dinner"></label><label>Category<select name="category"><option>Food</option><option>Medicine</option><option>Treat</option></select></label><div class="pair"><label>Date<input type="date" name="date" required></label><label>Time<input type="time" name="time" required></label></div><label>Repeat<select name="repeat"><option value="once">Once</option><option value="daily">Every day</option><option value="weekly">Selected weekdays</option></option></select></label><fieldset id="weekdays" hidden><legend>Weekdays</legend><div class="checks"></div></fieldset><label>Follow-up and snooze interval (minutes)<input name="interval" type="number" min="1" max="1440" value="10" required></label><label>Notes<textarea name="notes" rows="2" maxlength="500"></textarea></label><div class="bar"><button id="remove" type="button" class="danger" hidden>Delete schedule</button><button class="primary save">Save reminder</button></div></form></dialog>
<dialog id="log"><div class="bar"><h2>Care history</h2><button data-close="log" aria-label="Close">×</button></div><div id="entries"></div></dialog><aside id="alerts" aria-live="polite"></aside></body></html>
